<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PITBIT — SMM Отчёт</title>
<style>
  :root {
    --dark: #1a1a1a; --dark2: #282828; --card: #242424; --border: #3a3a3a;
    --blue: #0069CF; --blue-light: #0D99FF; --green: #14AE5C; --red: #DA0F0F;
    --muted: #687D89; --light: #E6EDF3; --label: #CFCFCF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--dark); color: var(--light); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; min-height: 100vh; }

  /* HEADER */
  .header { background: var(--dark2); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; }
  .logo { background: var(--blue); color: #fff; font-size: 14px; font-weight: 700; padding: 6px 14px; border-radius: 6px; letter-spacing: 1px; }
  .header-title { font-size: 16px; font-weight: 700; }
  .header-sub { font-size: 11px; color: var(--muted); }
  .btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--light); }
  .btn-ghost:hover { border-color: var(--blue); color: var(--blue-light); }
  .btn-primary { background: var(--blue); color: #fff; }
  .period-badge { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; font-size: 12px; color: var(--label); }

  /* STATUS */
  .status-bar { background: var(--dark2); border-bottom: 1px solid var(--border); padding: 8px 28px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .status-dot.loading { background: #f59e0b; animation: pulse 1s infinite; }
  .status-dot.error { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* PERIOD SELECTOR */
  .period-bar { background: var(--dark2); border-bottom: 1px solid var(--border); padding: 10px 28px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .toggle-btn { padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; }
  .toggle-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .period-input { background: var(--card); border: 1px solid var(--border); color: var(--light); padding: 5px 10px; border-radius: 6px; font-size: 12px; }
  .period-label { font-size: 12px; color: var(--muted); }
  .load-btn { margin-left: auto; }

  /* CONTENT */
  .content { padding: 24px 28px; max-width: 1400px; }

  /* SUMMARY CARDS */
  .sum-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .sum-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .sum-card-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .sum-card-value { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .sum-card-sub { font-size: 10px; color: var(--muted); }

  /* SECTION */
  .section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .section-title { font-size: 12px; font-weight: 600; color: var(--label); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 14px; }

  /* TABLE */
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { padding: 8px 10px; text-align: right; color: var(--muted); font-weight: 600; font-size: 11px; border-bottom: 1px solid var(--border); }
  th:first-child { text-align: left; }
  td { padding: 8px 10px; text-align: right; border-bottom: 1px solid #2a2a2a; }
  td:first-child { text-align: left; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,.02); }

  /* NOTES */
  .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .note-block { background: var(--dark2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .note-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
  .note-text { font-size: 12px; line-height: 1.6; color: var(--light); white-space: pre-wrap; }

  /* LINKS */
  .links-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .link-card { background: var(--dark2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--light); font-size: 12px; }
  .link-card:hover { border-color: var(--blue); }
  .link-card span { color: var(--blue-light); }

  /* INFLUENCER TOTALS */
  .inf-totals { display: flex; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .inf-total { background: var(--dark2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; }
  .inf-total-label { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
  .inf-total-val { font-size: 18px; font-weight: 700; }

  /* EMPTY */
  .empty { text-align: center; color: var(--muted); padding: 40px; font-size: 13px; }

  /* PRINT */
  @media print { .header, .period-bar, .status-bar { display: none !important; } body { background: #fff; color: #111; } .section, .sum-card { background: #fff; border-color: #ddd; } .sum-card-value, .section-title { color: #111; } }
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:14px;">
    <div class="logo">PITBIT</div>
    <div>
      <div class="header-title">SMM Отчёт</div>
      <div class="header-sub">Просмотр данных · только чтение</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="period-badge" id="periodBadge">—</div>
    <button class="btn btn-ghost" onclick="openPrintReport()">🖨️ PDF</button>
  </div>
</div>

<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <span id="statusText">Загружаем данные...</span>
</div>

<div class="period-bar">
  <span class="period-label">Период:</span>
  <button class="toggle-btn active" id="btn-week"     onclick="setPeriod('week')">Неделя</button>
  <button class="toggle-btn"        id="btn-month"    onclick="setPeriod('month')">Месяц</button>
  <button class="toggle-btn"        id="btn-quarter"  onclick="setPeriod('quarter')">Квартал</button>
  <button class="toggle-btn"        id="btn-halfyear" onclick="setPeriod('halfyear')">Полгода</button>
  <button class="toggle-btn"        id="btn-year"     onclick="setPeriod('year')">Год</button>
  <span class="period-label">С</span>
  <input class="period-input" type="date" id="date-from">
  <span class="period-label">По</span>
  <input class="period-input" type="date" id="date-to">
  <button class="btn btn-ghost load-btn" onclick="loadData()">🔄 Обновить</button>
</div>

<div class="content">
  <div id="mainContent">
    <div class="empty">⏳ Загружаем данные из Notion...</div>
  </div>
</div>

<script>
const NOTION_LOAD_URL = 'https://n8n.pitbit.space/webhook/pitbit-dashboard-load';
const DASHBOARD_SECRET = 'BmCncXrGfRoeqeL1ny3SS0_ZJuL703wq';

const PLATFORMS = [
  { id:'ig',  name:'Instagram',  icon:'📸', color:'#E1306C' },
  { id:'tg',  name:'Telegram',   icon:'✈️', color:'#0088cc' },
  { id:'vk',  name:'ВКонтакте', icon:'💙', color:'#0077FF' },
  { id:'yt',  name:'YouTube',    icon:'▶️', color:'#FF0000' },
  { id:'rt',  name:'Rutube',     icon:'🔴', color:'#ff4800' },
  { id:'dz',  name:'Дзен',       icon:'🟠', color:'#FF6B00' },
  { id:'li',  name:'LinkedIn',   icon:'💼', color:'#0A66C2' },
  { id:'fb',  name:'Facebook',   icon:'👤', color:'#1877F2' },
  { id:'tt',  name:'TikTok',     icon:'🎵', color:'#69C9D0' },
];

let currentPeriod = 'week';
let dashData = null;

function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  dot.className = 'status-dot' + (state === 'loading' ? ' loading' : state === 'error' ? ' error' : '');
  txt.textContent = text;
}

function setPeriod(p) {
  currentPeriod = p;
  ['week','month','quarter','halfyear','year'].forEach(id => {
    document.getElementById('btn-'+id)?.classList.toggle('active', id === p);
  });
  if (p !== 'custom') {
    const now = new Date();
    const to = now.toISOString().split('T')[0];
    const from = new Date(now);
    if      (p === 'week')     from.setDate(from.getDate() - 7);
    else if (p === 'month')    from.setMonth(from.getMonth() - 1);
    else if (p === 'quarter')  from.setMonth(from.getMonth() - 3);
    else if (p === 'halfyear') from.setMonth(from.getMonth() - 6);
    else if (p === 'year')     from.setFullYear(from.getFullYear() - 1);
    document.getElementById('date-from').value = from.toISOString().split('T')[0];
    document.getElementById('date-to').value = to;
  }
  loadData();
}

function gv(data, pid, metric) {
  return parseFloat(data[pid]?.[metric]) || 0;
}
function gs(data, pid, metric) {
  return data[pid]?.[metric] || '';
}
function fmt(n) {
  return n >= 1000000 ? (n/1000000).toFixed(1)+'M' : n >= 1000 ? (n/1000).toFixed(1)+'K' : n > 0 ? n.toLocaleString('ru-RU') : '—';
}
function fmtRaw(n) { return n > 0 ? n.toLocaleString('ru-RU') : '—'; }

async function loadData() {
  const dateFrom = document.getElementById('date-from').value;
  const dateTo   = document.getElementById('date-to').value;
  if (!dateFrom || !dateTo) return;

  setStatus('loading', 'Загружаем данные из Notion...');
  document.getElementById('periodBadge').textContent = `${dateFrom} — ${dateTo}`;

  try {
    const res = await fetch(`${NOTION_LOAD_URL}?period=${currentPeriod}&date_from=${dateFrom}&date_to=${dateTo}`, { headers: { 'X-Dashboard-Secret': DASHBOARD_SECRET } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();

    if (json.found && json.data) {
      dashData = json.data;
      renderAll(json.data, dateFrom, dateTo);
      setStatus('ok', `Данные за ${dateFrom} — ${dateTo} · обновлено ${new Date().toLocaleTimeString('ru')}`);
    } else {
      setStatus('error', 'Нет данных за выбранный период');
      document.getElementById('mainContent').innerHTML = '<div class="empty">📭 Нет данных за этот период.<br>СММ-специалист ещё не внёс показатели.</div>';
    }
  } catch(e) {
    setStatus('error', 'Ошибка загрузки: ' + e.message);
    document.getElementById('mainContent').innerHTML = `<div class="empty">❌ Не удалось загрузить данные.<br><small>${e.message}</small></div>`;
  }
}

function renderAll(d, dateFrom, dateTo) {
  let totalSubs = 0, totalReach = 0, totalEng = 0, totalPosts = 0;
  PLATFORMS.forEach(p => {
    totalSubs  += gv(d, p.id, 'subs');
    totalReach += gv(d, p.id, 'reach') + gv(d, p.id, 'views') + gv(d, p.id, 'reads');
    totalPosts += gv(d, p.id, 'posts');
    totalEng   += gv(d, p.id, 'likes') + gv(d, p.id, 'reactions') + gv(d, p.id, 'comments') + gv(d, p.id, 'saves') + gv(d, p.id, 'reposts');
  });
  const avgER = totalSubs > 0 ? (totalEng / totalSubs * 100).toFixed(2) : '—';

  // Platform table rows
  const tableRows = PLATFORMS.map(p => {
    const subs = gv(d, p.id, 'subs'), prev = gv(d, p.id, 'subs_prev'), growth = subs - prev;
    const reach = gv(d, p.id, 'reach') + gv(d, p.id, 'views') + gv(d, p.id, 'reads');
    const likes = gv(d, p.id, 'likes') + gv(d, p.id, 'reactions');
    const comments = gv(d, p.id, 'comments'), reposts = gv(d, p.id, 'reposts'), posts = gv(d, p.id, 'posts');
    const linkClicks = gv(d, p.id, 'link_clicks');
    const eng = likes + comments + gv(d, p.id, 'saves') + reposts;
    const base = subs > 0 ? subs : reach;
    const er = base > 0 && eng > 0 ? (eng/base*100).toFixed(2)+'%' : '—';
    const growthColor = growth > 0 ? '#14AE5C' : growth < 0 ? '#DA0F0F' : 'var(--muted)';
    const growthStr = growth !== 0 ? `<span style="color:${growthColor}">${growth > 0 ? '+' : ''}${fmtRaw(growth)}</span>` : '—';
    const erColor = er !== '—' ? '#14AE5C' : 'var(--muted)';
    if (!subs && !reach && !eng && !posts) return `<tr><td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${p.color};margin-right:6px;vertical-align:middle;"></span>${p.icon} ${p.name}</td><td colspan="8" style="text-align:center;color:var(--muted);font-size:11px;">нет данных</td></tr>`;
    return `<tr>
      <td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${p.color};margin-right:6px;vertical-align:middle;"></span>${p.icon} ${p.name}</td>
      <td>${subs > 0 ? fmtRaw(subs) : '—'}</td>
      <td>${growthStr}</td>
      <td>${reach > 0 ? fmtRaw(reach) : '—'}</td>
      <td>${likes > 0 ? fmtRaw(likes) : '—'}</td>
      <td>${comments > 0 ? fmtRaw(comments) : '—'}</td>
      <td>${linkClicks > 0 ? fmtRaw(linkClicks) : '—'}</td>
      <td style="color:${erColor};font-weight:600;">${er}</td>
      <td>${posts > 0 ? posts : '—'}</td>
    </tr>`;
  }).join('');

  // Influencers
  const infRows = (d._influencers || []).filter(r => r.name || r.reach || r.leads);
  const totalBudget = infRows.reduce((s,r) => s+(r.cost||0), 0);
  const totalLeads  = infRows.reduce((s,r) => s+(r.leads||0), 0);
  const avgCPL = totalLeads > 0 && totalBudget > 0 ? Math.round(totalBudget/totalLeads) : null;
  const infHtml = infRows.length ? `
    <div class="section">
      <div class="section-title">🤝 Инфлюенсеры</div>
      <div class="inf-totals">
        <div class="inf-total"><div class="inf-total-label">Лиды</div><div class="inf-total-val" style="color:#14AE5C;">${totalLeads || '—'}</div></div>
        <div class="inf-total"><div class="inf-total-label">Бюджет</div><div class="inf-total-val">${totalBudget > 0 ? totalBudget.toLocaleString('ru')+' ₽' : '—'}</div></div>
        <div class="inf-total"><div class="inf-total-label">Средний CPL</div><div class="inf-total-val" style="color:${avgCPL ? (avgCPL<1000?'#14AE5C':avgCPL<3000?'#0D99FF':'#DA0F0F') : 'var(--muted)'};">${avgCPL ? avgCPL.toLocaleString('ru')+' ₽' : '—'}</div></div>
        <div class="inf-total"><div class="inf-total-label">Охват (сумма)</div><div class="inf-total-val">${fmt(infRows.reduce((s,r)=>s+(r.reach||0),0))}</div></div>
      </div>
      <table>
        <thead><tr><th style="text-align:left;">Блогер / Канал</th><th style="text-align:left;">Платформа</th><th style="text-align:left;">Формат</th><th>Дата</th><th>Охват</th><th>Лиды</th><th>Бюджет</th><th>CPL</th></tr></thead>
        <tbody>${infRows.map(r => {
          const cpl = r.leads > 0 && r.cost > 0 ? Math.round(r.cost/r.leads) : null;
          return `<tr>
            <td style="text-align:left;">${r.name||'—'}</td>
            <td style="text-align:left;">${r.platform||'—'}</td>
            <td style="text-align:left;">${r.format||'—'}</td>
            <td>${r.date||'—'}</td>
            <td>${r.reach>0?fmt(r.reach):'—'}</td>
            <td>${r.leads>0?r.leads:'—'}</td>
            <td>${r.cost>0?r.cost.toLocaleString('ru')+' ₽':'—'}</td>
            <td style="font-weight:600;color:${cpl?(cpl<1000?'#14AE5C':cpl<3000?'#0D99FF':'#DA0F0F'):'var(--muted)'};">${cpl?cpl.toLocaleString('ru')+' ₽':'—'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>` : '';

  // Notes
  const noteGoals = d._notes_goals || '';
  const noteSmm   = d._notes_smm   || '';
  const noteMgmt  = d._notes_mgmt  || '';
  const notesHtml = (noteGoals || noteSmm || noteMgmt) ? `
    <div class="section">
      <div class="section-title">📝 Заметки</div>
      <div class="notes-grid">
        ${noteGoals ? `<div class="note-block"><div class="note-label">🎯 Цели периода</div><div class="note-text">${noteGoals}</div></div>` : ''}
        ${noteSmm   ? `<div class="note-block"><div class="note-label">📱 Заметки СММ</div><div class="note-text">${noteSmm}</div></div>` : ''}
        ${noteMgmt  ? `<div class="note-block"><div class="note-label">📋 Заметки руководства</div><div class="note-text">${noteMgmt}</div></div>` : ''}
      </div>
    </div>` : '';

  // Quick links
  const links = [...(d._links?.content||[]), ...(d._links?.custom||[])];
  const linksHtml = links.length ? `
    <div class="section">
      <div class="section-title">🔗 Быстрые ссылки</div>
      <div class="links-grid">
        ${links.map(lk => `<a href="${lk.url||'#'}" target="_blank" class="link-card">${lk.icon||'🔗'} <span>${lk.title||lk.url}</span></a>`).join('')}
      </div>
    </div>` : '';

  document.getElementById('mainContent').innerHTML = `
    <div class="sum-cards">
      <div class="sum-card"><div class="sum-card-label">Аудитория</div><div class="sum-card-value">${fmt(totalSubs)}</div><div class="sum-card-sub">по всем платформам</div></div>
      <div class="sum-card"><div class="sum-card-label">Охват / Просмотры</div><div class="sum-card-value">${fmt(totalReach)}</div><div class="sum-card-sub">суммарно за период</div></div>
      <div class="sum-card"><div class="sum-card-label">Вовлечённость</div><div class="sum-card-value">${fmt(totalEng)}</div><div class="sum-card-sub">лайки + коммент. + реп.</div></div>
      <div class="sum-card"><div class="sum-card-label">Средний ER</div><div class="sum-card-value" style="color:#14AE5C;">${avgER}%</div><div class="sum-card-sub">по всем аккаунтам</div></div>
      <div class="sum-card"><div class="sum-card-label">Публикаций</div><div class="sum-card-value">${totalPosts || '—'}</div><div class="sum-card-sub">за период</div></div>
    </div>

    <div class="section">
      <div class="section-title">📊 По платформам</div>
      <table>
        <thead><tr>
          <th style="text-align:left;">Платформа</th>
          <th>Подписчики</th><th>Прирост</th><th>Охват</th>
          <th>Реакции</th><th>Коммент.</th><th>Переходы</th>
          <th>ER %</th><th>Постов</th>
        </tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>

    ${infHtml}
    ${notesHtml}
    ${linksHtml}
  `;
}

function openPrintReport() {
  if (!dashData) { alert('Сначала загрузите данные'); return; }
  const dateFrom = document.getElementById('date-from').value || '—';
  const dateTo   = document.getElementById('date-to').value   || '—';
  // Re-use the same print logic inline
  const fmtP = n => n >= 1000000 ? (n/1000000).toFixed(1)+'M' : n >= 1000 ? (n/1000).toFixed(1)+'K' : n > 0 ? n.toString() : '—';
  const fmtRP = n => n > 0 ? n.toLocaleString('ru-RU') : '—';
  const d = dashData;

  let totalSubs = 0, totalReach = 0, totalEng = 0;
  PLATFORMS.forEach(p => {
    totalSubs  += gv(d,p.id,'subs');
    totalReach += gv(d,p.id,'reach') + gv(d,p.id,'views') + gv(d,p.id,'reads');
    totalEng   += gv(d,p.id,'likes') + gv(d,p.id,'reactions') + gv(d,p.id,'comments') + gv(d,p.id,'saves') + gv(d,p.id,'reposts');
  });
  const avgER = totalSubs > 0 ? (totalEng/totalSubs*100).toFixed(2) : '—';

  const platformRows = PLATFORMS.map(p => {
    const subs=gv(d,p.id,'subs'),prev=gv(d,p.id,'subs_prev'),growth=subs-prev;
    const reach=gv(d,p.id,'reach')+gv(d,p.id,'views')+gv(d,p.id,'reads');
    const likes=gv(d,p.id,'likes')+gv(d,p.id,'reactions'),comments=gv(d,p.id,'comments');
    const reposts=gv(d,p.id,'reposts'),posts=gv(d,p.id,'posts'),linkClicks=gv(d,p.id,'link_clicks');
    const eng=likes+comments+gv(d,p.id,'saves')+reposts,base=subs>0?subs:reach;
    const er=base>0&&eng>0?(eng/base*100).toFixed(2)+'%':'—';
    const gs=growth>0?`<span style="color:#16a34a">+${fmtRP(growth)}</span>`:growth<0?`<span style="color:#dc2626">${fmtRP(growth)}</span>`:'—';

  const links=[...(d._links?.content||[]),...(d._links?.custom||[])];

ss="card"><div class="card-label">Аудитория</div><div class="card-value">${fmtP(totalSubs)}</div></div><div class="card"><div class="card-label">Охват</div><div class="card-value">${fmtP(totalReach)}</div></div><div class="card"><div class="card-label">Вовлечённость</div><div class="card-value">${fmtP(totalEng)}</div></div><div class="card"><div class="card-label">Средний ER</div><div class="card-value" style="color:#16a34a;">${avgER}%</div></div></div><div class="section-title">Сводная таблица по платформам</div><table><thead><tr><th>Платформа</th><th>Подписчики</th><th>Прирост</th><th>Охват</th><th>Реакции</th><th>Коммент.</th><th>Переходы</th><th>ER %</th><th>Постов</th></tr></thead><tbody>${platformRows}</tbody></table>${infHtml}${notesHtml}${linksHtml}<div class="footer"><div>PITBIT Ecosystem — SMM Analytics Dashboard</div><div class="confidential">CONFIDENTIAL</div></div><script>window.onload=()=>window.print();<\/script></body></html>`;
